<!-- ===== 初期化と消去 ===== -->
<section class="page" role="main" id="p-data" hidden>
  <div class="group" style="margin-top:16px">
    <button class="cell danger" id="reset">設定を初期状態に戻す</button>
    <button class="cell danger" id="clearCache">キャッシュを削除</button>
  </div>
  <div class="hint">「設定を初期状態に戻す」では、リスト・閲覧履歴・読書位置は消えません。キャッシュを消しても、ログイン・リスト・設定は消えません。</div>
  <div class="group" style="margin-top:20px">
    <button class="cell danger" id="wipeAll">すべてのデータを削除</button>
  </div>
  <div class="hint">リスト・設定・閲覧履歴・読書位置・ミュート・オフライン保存をすべて消します。ログイン情報は消えません。先に書き出しておくと復元できます。</div>
</section>
