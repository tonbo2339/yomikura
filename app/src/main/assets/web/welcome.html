<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>はじめに</title>
<link rel="stylesheet" href="app.css">
<style>
  .lead { font-size: 15px; line-height: 1.7; color: var(--sub); margin: 0 4px 8px; }
  .go { margin-top: 28px; }
  .choice { display: flex; flex-direction: column; gap: 10px; }
  .choice button { text-align: left; padding: 14px 16px; min-height: 64px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1.5px transparent; }
  .choice button b { display: block; font-size: 16px; }
  .choice button small { display: block; margin-top: 2px; font-size: 13px; color: var(--sub); }
  .choice button.on { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<main>
<header class="page-head"><div><h1>ようこそ</h1></div></header>
<p class="lead" id="ageLead">はじめに、18 歳以上か教えてください。18 歳以上なら、R18 のサイト (ノクターン・ムーンライト・ミッドナイト) も選べます。</p>
<div class="choice" id="adult">
  <button data-v="1"><b>18 歳以上です</b><small>R18 のサイトも選べます</small></button>
  <button data-v="0"><b>18 歳未満です</b><small>R18 のサイトは出しません</small></button>
</div>

<div id="sitesBox" hidden>
<p class="lead" style="margin-top:24px">読みたいサイトを選んでください。選ばなかったサイトは、上部バーや更新の確認に出ません。あとから設定の「表示するサイト」でいつでも変えられます。</p>

<div class="group" id="siteList"></div>

<div class="group" style="margin-top:20px">
  <label class="cell"><span class="text">起動時に更新を自動で確認</span><input type="checkbox" class="switch" id="auto"></label>
</div>
<div class="hint">各サイトにログインして、ブックマークやしおりを使っている人向けです。ログインしていないサイトは確認しません (ログインは設定の「ログイン」から)。あとから設定でも変えられます。</div>

<div class="go"><button class="btn primary block" id="start">はじめる</button></div>
<div class="hint" id="warn" hidden>サイトを 1 つ以上選んでください。</div>
</div>

</main>
<!--#scripts core-->
<script src="app.js"></script>
<script>
// 初めて起動したときだけ出る画面。選んだサイトを設定 (settings.sites) に保存して、起動ページへ進む。
// サイトの表 (SITES) は app.js
const on = Object.assign({}, NH.SITE_DEFAULT);
// 成人向けのサイトを自分で使うと決めた人だけが使う版 (NH.R18_OPT_IN) は、年齢を聞かず、成人向けのサイトも出さない。使うときは設定の「NSFW モード」をオフにするときに年齢を確かめる
const OPT_IN = NH.R18_OPT_IN;
let adult = OPT_IN ? false : null; // 答えるまでサイトの選択は出さない
const rows = {}; // R18 のサイト → [行, スイッチ]
const refresh = () => {
  $$('#adult button').forEach((b) => { const on = adult !== null && b.dataset.v === (adult ? '1' : '0'); b.classList.toggle('on', on); setPressed(b, on); });
  $('sitesBox').hidden = adult === null;
  Object.values(rows).forEach(([row]) => (row.hidden = !adult));
  const any = Object.entries(on).some(([k, v]) => v && (adult || !NH.R18_SITES.includes(k)));
  $('start').disabled = !any;
  $('warn').hidden = any;
};
$$('#adult button').forEach((b) => (b.onclick = () => { adult = b.dataset.v === '1'; refresh(); }));
SITES.filter(([k, label, r18]) => !(OPT_IN && r18)).forEach(([k, label, r18]) => {
  const row = el('label', 'cell');
  const name = el('span', 'text');
  name.append(el('span', 'dot ' + siteDot(k)), document.createTextNode('  ' + label + (r18 ? ' (R18)' : '')));
  const cb = el('input', 'switch'); cb.type = 'checkbox'; cb.checked = !!on[k];
  cb.onchange = () => { on[k] = cb.checked; refresh(); };
  if (r18) rows[k] = [row, cb];
  row.append(name, cb);
  $('siteList').appendChild(row);
});
$('start').onclick = () => {
  NH.update((d) => {
    const sites = Object.assign({}, on);
    if (!adult) NH.R18_SITES.forEach((k) => (sites[k] = false));
    // 年齢を聞かなかった版は、adult を書かない (未設定 = 18 歳以上扱い。R18 は nsfw の既定で出ない)
    d.settings = Object.assign(d.settings || {}, { sites, autoCheck: $('auto').checked, welcomed: true }, OPT_IN ? {} : { adult });
  });
  // 起動ページ (設定した行き先) へ。このあとは「戻る」でこの画面に戻らないよう replace
  location.replace(window.NHStore && NHStore.startUrl ? NHStore.startUrl() : NH.LIST_URL);
};
if (OPT_IN) { $('ageLead').hidden = true; $('adult').hidden = true; }
refresh();
</script>
</body>
</html>
