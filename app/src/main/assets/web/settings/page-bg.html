<!-- ===== 裏での確認と通知 ===== -->
<section class="page" role="main" id="p-bg" hidden>
  <div class="hint" id="bgNone" hidden>確認するサイトがありません。「更新の確認」で選んでください。</div>
  <div class="hint" id="bgNeedLogin" hidden>ログイン中のサイトがありません。先にログインしてください (設定 → サイト → ログイン)。</div>
  <div class="group" style="margin-top:16px" id="bgToggleGroup">
    <label class="cell"><span class="text">決めた時間に裏で確認して通知</span><input type="checkbox" class="switch" id="bgOn"></label>
  </div>
  <div class="hint">新しい話が出た作品があるときだけ通知します。アプリを開いている間と、確認から 1 時間以内は通知しません。</div>
  <div id="bgBox">
    <div class="group" id="bgNotifyWarn" hidden style="margin-top:12px">
      <button class="cell accent" id="bgNotifyAsk"><span class="text">通知が許可されていません。許可する</span></button>
    </div>
    <div class="section-label">時間の決め方</div>
    <div class="group" id="bgRules"></div>
    <div class="section-label">曜日</div>
    <div class="group"><div class="cell"><div class="bg-days" id="bgDays"></div></div></div>
    <div class="section-label">予定</div>
    <div class="group">
      <div class="cell"><span class="text">確認する時刻<small id="bgSlots"></small></span></div>
      <div class="cell"><span class="text">次の確認</span><span class="value" id="bgNext"></span></div>
    </div>
  </div>
</section>
