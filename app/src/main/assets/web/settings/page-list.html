<!-- ===== リスト ===== -->
<section class="page" role="main" id="p-list" hidden>
  <div class="section-label">上のカード</div>
  <div class="group">
    <label class="cell"><span class="text">さっきまで読んでいた作品を出す</span><input type="checkbox" class="switch" id="heroResume" data-setting="heroResume"></label>
  </div>
  <div class="hint">オンは最近読んだ作品の「続きから読む」、オフはリスト先頭の作品を、上のカードに出します。</div>
  <div class="section-label">並べ替え</div>
  <div class="group">
    <label class="cell"><span class="text">読む順番の上下ボタンを表示</span><input type="checkbox" class="switch" id="listArrows" data-setting="listArrows"></label>
  </div>
  <div class="hint">各作品に ▲▼ を出します。長押しして動かす入れ替えは、いつでも使えます。</div>
  <div class="group" style="margin-top:16px">
    <label class="cell"><span class="text">読了を自動で削除</span><input type="checkbox" class="switch" id="pruneDone" data-setting="pruneDone"></label>
  </div>
  <div id="pruneDaysBox">
    <div class="section-label">読了にしてから、この日数がたったとき</div>
    <div class="group" id="pruneDaysList"></div>
  </div>
  <div class="hint">削除はリストを開いたときに行い、読書位置の記録も消えます。リストの「読了」の欄からまとめて消すこともできます。</div>
</section>
