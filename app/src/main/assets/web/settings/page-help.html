<!-- ===== 使い方とヒント ===== -->
<section class="page" role="main" id="p-help" data-title="使い方とヒント" hidden>
  <div class="section-label" style="margin-top:16px">使い方</div>
  <div class="group">
    <button class="cell has-icon" id="tutorialBtn"><span class="ico blue" data-icon="info"></span><span class="text">チュートリアル</span></button>
    <button class="cell has-icon" id="guideBtn"><span class="ico blue" data-icon="play"></span><span class="text">さわって覚えるガイド</span></button>
    <label class="cell has-icon"><span class="ico gray" data-icon="info"></span><span class="text">画面ごとのヒントを出す</span><input type="checkbox" class="switch" id="hintsOn" data-setting="hints"></label>
    <button class="cell has-icon" id="hintsReset"><span class="ico gray" data-icon="refresh"></span><span class="text">ヒントをもう一度出す</span></button>
  </div>
  <div class="hint">ヒントは、初めて開いた画面に 1 回だけ出る。</div>
</section>
