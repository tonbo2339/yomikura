<!-- ===== 閲覧履歴 ===== -->
<section class="page" role="main" id="p-history" hidden>
  <div class="group" style="margin-top:16px">
    <a class="cell" href="list.html#history" id="historyLink" style="text-decoration:none"><span class="text">閲覧履歴を開く</span></a>
    <label class="cell"><span class="text">閲覧履歴を記録<small id="historyCount"></small></span><input type="checkbox" class="switch" id="history" data-setting="history"></label>
  </div>
  <div class="section-label">残す作品数</div>
  <div class="group" id="historyMaxList"></div>
  <div class="section-label">残す期間 (最後に開いてから)</div>
  <div class="group" id="historyDaysList"></div>
  <div class="group" style="margin-top:20px">
    <button class="cell danger" id="clearHistory">閲覧履歴を消去</button>
  </div>
  <div class="hint">リストと読書位置は消えません。</div>
  <div class="hint">上限を超えた分と古い分は、作品やリストを開いたときに消えます。サイトの公式の履歴は、そのサイトの履歴ページを開いたときだけ読み取ります。</div>
</section>
