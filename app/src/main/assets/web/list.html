<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>リスト</title>
<link rel="stylesheet" href="app.css">
<style>
<!--#include list/style.css-->
</style>
</head>
<body>
<main>
<header class="page-head">
  <div>
    <h1>リスト</h1>
    <div class="check-row" id="checkRow">
      <span class="check-prog" id="checkProg" hidden></span>
      <span class="check-last" id="checkLast"></span>
    </div>
  </div>
  <div style="display:flex;gap:4px;align-items:center">
    <button class="check-btn" id="collect" type="button"><svg class="check-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg><svg class="check-book" viewBox="0 0 24 24" aria-hidden="true"><rect class="bg" width="24" height="24" rx="6"/><rect class="cover" x="2.5" y="4" width="19" height="16" rx="1.5"/><g class="pg-l"><rect x="4" y="5.5" width="7.6" height="13" rx=".8"/><path d="M5.8 9h4M5.8 12h4M5.8 15h3"/></g><rect class="spine" x="11.5" y="3.5" width="1" height="17"/><g class="pg"><rect x="12.4" y="5.5" width="7.6" height="13" rx=".8"/><path d="M14.2 9h4M14.2 12h4M14.2 15h3"/></g><g class="pg"><rect x="12.4" y="5.5" width="7.6" height="13" rx=".8"/><path d="M14.2 9h4M14.2 12h4M14.2 15h3"/></g><g class="pg"><rect x="12.4" y="5.5" width="7.6" height="13" rx=".8"/><path d="M14.2 9h4M14.2 12h4M14.2 15h3"/></g></svg><span id="collectText">更新を確認</span></button>
    <button class="icon-btn" id="searchBtn" aria-label="検索"></button>
  </div>
</header>

<div class="tabbar"><div class="seg" id="tabs"></div></div>
<div class="searchbar" id="searchBar" hidden>
  <svg viewBox="0 0 24 24" id="searchIcon"></svg>
  <input id="q" type="search" placeholder="作品名・メモ・タグ・サイトで検索" autocomplete="off" enterkeyhint="search">
  <span class="count" id="qCount"></span>
  <button class="icon-btn" id="qClose" aria-label="検索を閉じる"></button>
</div>
<div class="sortrow" id="sortRow"><label>並べ替え <select id="sortSel"></select></label></div>
<div class="chips filters" id="filters"></div>
<div id="hero"></div>
<div class="list" id="active"></div>

<details class="done-box" id="doneBox">
  <summary><span id="doneHead">読了</span><svg viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></summary>
  <div class="list" id="done"></div>
  <div class="done-tools"><button class="btn danger" id="clearDone">読了をまとめて削除</button></div>
  <div class="done-hint" id="pruneHint"></div>
</details>

</main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="snack" id="snack" role="status" aria-live="polite"><span id="snackText"></span><button id="snackUndo">元に戻す</button></div>
<datalist id="tagList"></datalist>

<!--#scripts core-->
<script src="app.js"></script>
<script>
<!--#include list/state.js-->
<!--#include list/progress.js-->
<!--#include list/card.js-->
<!--#include list/render.js-->
<!--#include list/history.js-->
<!--#include list/sort.js-->
<!--#include list/hero.js-->
<!--#include list/sheet.js-->
<!--#include list/actions.js-->
<!--#include list/search.js-->
<!--#include list/collect.js-->
<!--#include list/sync.js-->
<!--#include list/drag.js-->
<!--#include list/start.js-->
</script>
</body>
</html>
