<!-- ===== 書き出す ===== -->
<section class="page" role="main" id="p-export" hidden>
  <div class="section-label">書き出す項目</div>
  <div class="group" id="exportList"></div>
  <div class="group" style="margin-top:20px">
    <button class="cell accent" id="exportOne">選んだ項目を 1 つのファイルにまとめる</button>
    <button class="cell accent" id="exportMany">項目ごとに別のファイルにする</button>
  </div>
  <div class="hint"><ul>
    <li>「まとめる」はファイル名、「別のファイル」は保存先のフォルダを選ぶ</li>
    <li>読み込み (設定のトップの「読み込む」) では、ファイルにある項目だけが置き換わる</li>
    <li>ログイン情報とオフライン保存の本文は含まない</li>
  </ul></div>
</section>
