<!-- ===== オフライン保存の設定 ===== -->
<section class="page" role="main" id="p-offlineset" hidden>
  <div class="section-label">保存</div>
  <div class="group">
    <label class="cell"><span class="text">Wi-Fi のときだけ保存する</span><input type="checkbox" class="switch" id="offlineWifiOnly" data-setting="offlineWifiOnly" data-default="off"></label>
  </div>
  <div class="hint">モバイル回線では、保存の前に確認します。保存中に Wi-Fi が切れたら、つながるまで待って、続きから再開します。</div>
  <div class="group" style="margin-top:16px">
    <label class="cell"><span class="text">新しい話を自動で保存する</span><input type="checkbox" class="switch" id="offlineAutoUpdate" data-setting="offlineAutoUpdate" data-default="off"></label>
  </div>
  <div class="hint">保存済みの作品に新しい話が出たら、自動で保存します (Wi-Fi のときだけ)。対象は、設定の「更新の確認」で選んだサイトの作品です。</div>
  <div class="section-label">読むとき</div>
  <div class="group">
    <label class="cell"><span class="text">縦書きで表示</span><input type="checkbox" class="switch" id="vertical" data-setting="vertical" data-default="off"></label>
  </div>
  <div class="hint">オフライン保存した作品の読み画面だけが縦書きになります。文字の大きさとフォントは「本文の文字」と共通です。</div>
</section>
