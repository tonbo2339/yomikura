<!-- ===== トップ ===== -->
<section class="page" role="main" id="p-main">
  <header class="page-head"><div><h1>設定</h1></div></header>

  <!-- 設定の検索 (search.js)。入力中は、下の一覧 (mainList) を隠して、結果 (searchResults) を出す -->
  <div class="search"><input type="search" id="setSearch" placeholder="設定を検索" aria-label="設定を検索" autocomplete="off" enterkeyhint="search"></div>
  <div id="searchResults" hidden></div>

  <div id="mainList">
  <!-- 新しいバージョンがあるときだけ出す -->
  <button class="update-card" id="updateCard" hidden>
    <span class="ico green" data-icon="refresh"></span>
    <span class="body"><span class="t1">アプリの更新</span><span class="t2" id="updateCardText"></span></span>
  </button>

  <div class="section-label">読む</div>
  <div class="group">
    <button class="cell has-icon" data-go="list" data-kw="お気に入り おきにいり 読了 どくりょう 消す けす 残す のこす 削除 さくじょ 次の作品 つぎ カード 履歴 りれき 並べ替え ならべかえ スワイプ 後で読む あとでよむ list favorites favourite read done remove delete next swipe read later queue"><span class="ico blue" data-icon="book"></span><span class="text">リスト</span></button>
    <button class="cell has-icon" data-go="fold" data-kw="感想 かんそう レビュー おすすめ 関連作品 かんれん 畳む たたむ 隠す かくす リアクション 広告 こうこく fold collapse comments reviews recommendations related reactions ads hide"><span class="ico teal" data-icon="down"></span><span class="text">話ページの下の欄</span></button>
    <button class="cell has-icon" data-go="ranking" data-kw="日間 にっかん 週間 しゅうかん 月間 げっかん ランキング 行き先 いきさき ranking daily weekly monthly destination"><span class="ico orange" data-icon="trophy"></span><span class="text">ランキングの行き先</span></button>

  </div>

  <div class="section-label">見た目</div>
  <div class="group">
    <div data-kw="ダーク ライト 暗い くらい 夜 よる 白 しろ 黒 くろ 自動 じどう theme dark light night auto appearance" class="cell has-icon stack"><span class="ico indigo" data-icon="moon"></span><span class="text">テーマ</span><div class="seg" id="themeSeg"></div></div>
    <div data-kw="ボタン 大きさ おおきさ サイズ 小さめ ちいさめ 大きめ おおきめ タップ 押しやすい おしやすい ui size density button size tap target large small" class="cell has-icon stack"><span class="ico gray" data-icon="swap"></span><span class="text">操作部分の大きさ</span><div class="seg" id="densitySeg"></div></div>

  </div>

  <div class="section-label">サイト</div>
  <div class="group">
    <button class="cell has-icon" data-go="sites" data-kw="サイト 表示 ひょうじ なろう ハーメルン カクヨム ノクターン ムーンライト タブ 並び ならび sites display narou hameln kakuyomu nocturne moonlight midnight tabs order"><span class="ico brown" data-icon="globe"></span><span class="text">表示するサイト</span></button>
    <label data-kw="R18 成人 せいじん 年齢 ねんれい 確認 かくにん アダルト r18 adult age confirm" class="cell has-icon" id="adultRow"><span class="ico pink" data-icon="person"></span><span class="text">18 歳以上</span><input type="checkbox" class="switch" id="adult"></label>
    <label data-kw="R18 成人 せいじん アダルト 18歳 じゅうはっさい ノクターン ムーンライト ミッドナイト 隠す かくす nsfw r18 adult mature nocturne moonlight midnight hide" class="cell has-icon"><span class="ico red lock" id="nsfwIco"><svg viewBox="0 0 24 24"><path class="shackle" d="M8.5 14V8a3.5 3.5 0 0 1 7 0v3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg></span><span class="text" id="nsfwLabel">NSFW モード</span><input type="checkbox" class="switch" id="nsfw"></label>

    <button class="cell has-icon" data-go="links" data-kw="リンク ブラウザ 外部 がいぶ アプリの中 開く ひらく links browser external open in app"><span class="ico gray" data-icon="link"></span><span class="text">リンクの扱い</span></button>
  </div>

  <div class="section-label">更新と通知</div>
  <div class="group">
    <button class="cell has-icon" data-go="start" data-kw="起動 きどう 最初 さいしょ ホーム 始まり はじまり 開く ひらく リスト 最後のページ start launch startup page home first open list last page"><span class="ico green" data-icon="home"></span><span class="text">起動ページ</span></button>
    <button class="cell has-icon" data-go="auto" data-kw="更新 こうしん 確認 かくにん 新着 しんちゃく チェック 自動 じどう 起動時 きどうじ 手動 しゅどう カテゴリ update check auto new arrivals startup manual category"><span class="ico orange" data-icon="refresh"></span><span class="text">更新の確認</span></button>
    <button class="cell has-icon" data-go="bg" data-kw="裏 うら バックグラウンド 通知 つうち 定期 ていき 曜日 ようび 時刻 じこく バッテリー background check notification schedule weekday time battery"><span class="ico red" data-icon="bell"></span><span class="text">裏での確認と通知</span></button>
  </div>

  <div class="section-label">記録</div>
  <div class="group">
    <button class="cell has-icon" data-go="stats" data-kw="統計 とうけい 記録 きろく 連続 れんぞく 日数 にっすう グラフ stats statistics record streak days graph"><span class="ico teal" data-icon="chart"></span><span class="text">読書の統計</span></button>
    <button class="cell has-icon" data-go="history" data-kw="履歴 りれき 記録 きろく 閲覧 えつらん 見た作品 みた history record browsing viewed"><span class="ico pink" data-icon="history"></span><span class="text">閲覧履歴</span></button>
  </div>

  <div class="section-label">データ</div>
  <div class="group">
    <button class="cell has-icon" data-go="export" data-kw="書き出す かきだす バックアップ 保存 ほぞん エクスポート 移行 いこう 機種変更 きしゅへんこう export backup save migrate transfer device"><span class="ico green" data-icon="download"></span><span class="text">書き出す</span></button>

    <button class="cell has-icon" data-go="data" data-kw="初期化 しょきか 消去 しょうきょ リセット 全部 ぜんぶ 削除 さくじょ データ reset erase clear delete all data factory"><span class="ico red" data-icon="del"></span><span class="text">初期化と消去</span></button>
  </div>

  <div class="section-label">使い方</div>
  <div class="group">
    <button class="cell has-icon" data-go="help" data-kw="チュートリアル ガイド ヒント 説明 せつめい ヘルプ 使い方 つかいかた 初心者 しょしんしゃ help tutorial guide hints tips how to beginner"><span class="ico blue" data-icon="info"></span><span class="text">使い方とヒント</span></button>
  </div>

  <div class="section-label">このアプリ</div>
  <div class="group">
    <button class="cell has-icon" data-go="update" data-kw="アプリの更新 こうしん バージョン アップデート 新しい版 あたらしい インストール app update version upgrade install new version release"><span class="ico gray" data-icon="info"></span><span class="text">アプリの更新</span></button>
    <button class="cell has-icon" data-go="licenses" data-kw="ライセンス オープンソース licenses open source oss"><span class="ico gray" data-icon="doc"></span><span class="text">オープンソースライセンス</span></button>
    <button class="cell has-icon" data-go="privacy" data-kw="プライバシー 個人情報 こじんじょうほう データの扱い あつかい 送信 そうしん privacy private information data handling send"><span class="ico gray" data-icon="lock"></span><span class="text">プライバシー</span></button>

  <div class="version" id="version"></div>
