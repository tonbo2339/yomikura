<!-- ===== 診断情報 ===== -->
<section class="page" role="main" id="p-diag" hidden>
  <div class="group" style="margin-top:16px">
    <div class="cell" style="padding:12px 16px"><button class="btn primary block" id="diagCopy" style="flex:1">診断情報をコピー</button></div>
  </div>
  <div class="hint">不具合を報告するときに貼り付ける情報をコピーします。版・端末・設定の要約・データの件数・直近のエラーだけで、作品名・URL・ログイン情報・メモは含みません。自動でデータを外部へ送信することはありません。</div>
  <div class="section-label">中身 (コピーされる文)</div>
  <div class="group">
    <div class="cell" style="padding:12px 16px"><pre id="diagText" style="margin:0;width:100%;white-space:pre-wrap;word-break:break-all;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);user-select:text;-webkit-user-select:text"></pre></div>
  </div>
  <div class="group" style="margin-top:20px">
    <button class="cell danger" id="diagClear">エラー・警告の記録を消す</button>
  </div>
</section>
