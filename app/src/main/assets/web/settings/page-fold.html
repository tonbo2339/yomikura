<section class="page" role="main" id="p-fold" hidden>
  <div class="group" style="margin-top:16px">
    <label class="cell"><span class="text">感想・レビュー・作者のお知らせを畳む</span><input type="checkbox" class="switch" id="foldComments" data-setting="foldComments"></label>
    <label class="cell"><span class="text">おすすめ作品の欄を畳む</span><input type="checkbox" class="switch" id="foldRecommend" data-setting="foldRecommend"></label>
    <label class="cell"><span class="text">作者・共有・リンクを畳む</span><input type="checkbox" class="switch" id="foldLinks" data-setting="foldLinks"></label>

  <details class="more"><summary>話ページの下の欄を、普段は畳んで「▼ …を表示」のボタンにします。</summary>
    <p>「応援・リアクション」はなろうの応援ポイントと顔文字、「作者・共有・リンク」は作者マイページ・共有・誤字報告・応援などの欄です。押すと、そのまま開いて読めます。なろうの「感想を書く」を押すと、畳んだ感想欄も開きます。ハーメルンの感想はページ内に出ないので対象外、カクヨムの応援コメントはもともと畳まれています。最終話の「関連小説」などは、おすすめとして畳みます。「開き具合を覚える」がオンなら、開いた欄は次の話でも開いたままです。</p></details>
</section>
