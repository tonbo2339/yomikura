<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>読み込めませんでした</title>
<link rel="stylesheet" href="app.css">
<style>
  .box { padding: 40px 20px 0; text-align: center; }
  .box h1 { font-size: 22px; margin: 0 0 8px; }
  .box p { color: var(--sub); font-size: 14px; line-height: 1.7; margin: 6px 0; word-break: break-all; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin: 28px 0 0; }
</style>
</head>
<body>
<main class="box">
  <h1>読み込めませんでした</h1>
  <p id="why"></p>
  <p id="url"></p>
  <div class="actions">
    <button class="btn primary block" id="retry">もう一度読み込む</button>
    <button class="btn block" id="list">リストを開く</button>
    <button class="btn block" id="offline">オフライン保存を開く</button>
    <button class="btn block" id="back">前のページへ戻る</button>
  </div>
  <p style="margin-top:20px">機内モードや電波の状態、サイトの一時的な不具合などで読み込めないことがあります。</p>
</main>
<!--#scripts core-->
<script src="app.js"></script>
<script>
// 読み込みに失敗したページの代わりに出す画面 (NovelClient の onReceivedError が u= に元の URL、m= に理由を付けて開く)
const q = new URLSearchParams(location.search);
const u = q.get('u') || '';
const ok = /^https?:\/\//.test(u); // 元の URL が http(s) のときだけ使う (それ以外の文字列は開かない)
// よくある理由は日本語にする (元の符号はかっこで残す。報告のときに役立つ)
const WHY = [
  [/INTERNET_DISCONNECTED|NETWORK_CHANGED|ADDRESS_UNREACHABLE/, '通信できません'],
  [/NAME_NOT_RESOLVED|NAME_RESOLUTION_FAILED/, 'サイトの場所が分かりませんでした (通信の状態を確かめてください)'],
  [/TIMED_OUT/, '時間がかかりすぎたので、やめました'],
  [/CONNECTION_(REFUSED|RESET|CLOSED|FAILED)/, 'サイトにつながりませんでした'],
  [/^HTTP 5\d\d$/, 'サイト側で問題が起きています'],
  [/^HTTP 4\d\d$/, 'ページが見つからないか、開けません'],
];
const m = q.get('m') || '';
const why = (WHY.find(([re]) => re.test(m)) || [])[1];
$('why').textContent = why ? why + ' (' + m + ')' : m;
$('url').textContent = ok ? u : '';
$('retry').hidden = !ok;
$('retry').onclick = () => location.replace(u);
$('list').onclick = () => (location.href = 'list.html');
$('offline').onclick = () => (location.href = 'offline.html');
$('back').onclick = () => (history.length > 2 ? history.go(-2) : history.back()); // 失敗したページ (1 つ前) を飛ばして戻る。戻るとまた失敗してここに来るため
</script>
</body>
</html>
