<!-- ===== リンクの扱い ===== -->
<section class="page" role="main" id="p-links" hidden>
  <div class="section-label">対応サイト以外のリンクをタップしたとき</div>
  <div class="group" id="linkModeList"></div>
  <div class="hint"><ul>
    <li>広告や本文中のリンクなど、対応サイト以外のページが対象</li>

    <li>ログインなどの移動は、どちらでもアプリの中で開く</li>
  </ul></div>
  <div class="section-label">ほかのアプリのリンク</div>
  <div class="group">
    <button class="cell" data-system="links"><span class="text">ほかのアプリのリンクをここで開く</span></button>

</section>
